name: Publicar tienda

# Desde el 14/10/2026 los precios NO estan en app.js: la tienda los toma de la
# planilla (hoja Productos y hoja Precios Combos) por `stock_full`, y el Portal Red del
# ERP por `action=precios`. Hasta ese dia este workflow regeneraba
# data/precios.json desde app.js; sin precios escritos lo dejaria vacio y
# romperia a quien lo lea, asi que ese paso se saco. data/precios.json queda
# congelado en el 14/10/2026 y ya no lo lee nadie.
#
# Lo que queda es el cache-buster: GitHub Pages sirve app.js con
# Cache-Control: max-age=14400 (4 horas), y el navegador cachea por URL EXACTA.
# Como el ?v= estuvo fijo en "20260819-1" desde el 19/8/2026, la URL no
# cambiaba y el navegador seguia usando su copia vieja. Paso el 1/9/2026: el
# modo autopedido estaba publicado y Tadeo no lo veia.
# Ojo con esto al verificar: `curl` y un navegador con el cache desactivado
# dicen que el servidor tiene el archivo nuevo, que es OTRA pregunta.

on:
  push:
    branches: [ main ]
    paths: [ 'app.js', 'styles.css' ]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-precios
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Actualizar el ?v= de index.html con el hash de cada archivo
        run: python3 _tools/cachebuster.py

      - name: Commitear solo si cambio
        run: |
          if git diff --quiet -- index.html; then
            echo "Sin cambios: nada que commitear."; exit 0
          fi
          git config user.name  "maleu-precios-bot"
          git config user.email "maleucongelados@gmail.com"
          git add index.html
          git commit -m "chore: cache-buster desde app.js [skip ci]"
          git push
