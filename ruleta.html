<div class="wrap">

  </div>

  <form class="card" id="form" novalidate>
    <div id="f-nombre"><label for="nombre">Tu nombre</label>

    </datalist>
    </div>

    <div class="trampa" aria-hidden="true"><label for="web">No completar</label><input id="web" name="web" tabindex="-1" autocomplete="off" /></div>

    <button class="btn" id="girar" type="submit">¡Listo! Quiero girar</button>

  <div class="card res" id="res" hidden></div>

<script>
(function () {
  'use strict';
  /* La ruleta de premios del QR (22/9/2026). Idea de Fede en la reunión del 21/9:
     que escaneen el QR EN EL MOMENTO, dejen el dato y giren. El premio lo elige el
     servidor (Apps Script, `ruletaGirar`): esta página solo lo dibuja. Nada de
     datos de clientes en este repo, que es público: todo va y viene del backend.

     El QR de cada lugar lleva su origen:  maleu.com.ar/ruleta?o=colegio&d=Los%20Robles&r=lucas
       o = folleto | colegio | evento | meta   (de dónde salió el lead)
       d = el lugar, texto libre                (queda en las notas del lead)
       r = lucas | tadeo | joaco                (quién lo consiguió) */
  var API = 'https://script.google.com/macros/s/AKfycbxmrG5YVSshcYezk8lXFx_uxb7NFGcb9EfTXc7dsIN4rZyj73CET4mk_aKPFPDY2wNi/exec';
  var TIENDA = 'https://maleu.com.ar/';
  var P = {}; try { new URLSearchParams(location.search).forEach(function (v, k) { P[k] = v; }); } catch (e) {}

  /* LOS DATOS DEL EVENTO, POR DEFECTO (24/9/2026).

     El link de WhatsApp llevaba los tres a cuestas:
       maleu.com.ar/ruleta?o=colegio&d=Los%20Robles&r=lucas&t={{phone}}&n={{name}}
     y en el telefono eso es un chorizo de tres renglones que encima muestra el
     `%20`. Tadeo: "es un choclo re feo".

     Son fijos para esta accion, asi que viven aca y el link queda en
       maleu.com.ar/ruleta?t={{phone}}&n={{name}}
     — de 95 caracteres a 49, una sola linea.

     **La URL sigue mandando**: si manana hay otro colegio, se le pasan `o`, `d`
     y `r` como siempre y estos defaults no se usan. O sea que esto acorta el
     link de hoy sin atar la pagina a Los Robles. Cuando el evento pase, lo
     honesto es volverlos a vaciar. */
  if (!P.o) P.o = 'colegio';
  if (!P.d) P.d = 'Los Robles';
  if (!P.r) P.r = 'lucas';
  var $ = function (id) { return document.getElementById(id); };
  var gira = $('gira'), premios = [], rot = 0, girando = false, raf = 0, dibujados = '';

  /* La rueda se dibuja YA, sin esperar al servidor (23/9/2026). El GET de premios
     tarda ~6 s en frío: mientras tanto la rueda mostraba 🎁 genéricos, se redibujaba
     de golpe, y si la persona giraba antes frenaba en seco sin caer en su premio.
     Ahora arranca con la última lista que vio este celular o, la primera vez, con
     esta copia; el servidor confirma por atrás y solo se redibuja si cambió.
     OJO: esta lista es solo para DIBUJAR. El premio lo sigue eligiendo el servidor. */
  /* Los de Los Robles, 24/9/2026 a la tarde: **cinco** gajos de distinto tamano
     (10% 25 + 25 · 15% 20 · empanadas 20 · nada 10). El peso es el tamano del
     gajo Y la probabilidad: ver `gajos()`. Antes de esa tarde eran 6 iguales
     (los repetidos se reparten el peso en Config_Maleu) para que parezca una ruleta.

     EL TEXTO TIENE QUE SER EL MISMO QUE MANDA EL SERVIDOR, palabra por palabra.
     No es prolijidad: `dibujar()` compara la firma (los textos unidos) para
     decidir si repinta, asi que una copia que dice otra cosa hace que la rueda
     se redibuje de golpe a los ~6 segundos — que es justo lo que esta copia
     vino a evitar. Verificado contra el endpoint el 23/9/2026: manda
     "15% en tu primera compra". */
  var PREMIOS_COPIA = [
    { i: 0, txt: '10% en tu próxima compra', min: 0, nada: false, peso: 25 },
    { i: 1, txt: '15% en tu próxima compra', min: 0, nada: false, peso: 20 },
    { i: 2, txt: '10% en tu próxima compra', min: 0, nada: false, peso: 25 },
    { i: 3, txt: 'Un paquete de empanadas', min: 0, nada: false, peso: 20 },
    { i: 4, txt: 'Nada esta vez', min: 0, nada: true, peso: 10 }
  ];
  try { var g0 = JSON.parse(localStorage.getItem('maleu_ruleta_premios') || 'null'); if (Array.isArray(g0) && g0.length) premios = g0; } catch (e) {}
  if (!premios.length) premios = PREMIOS_COPIA.slice();
  var confirmados = false, alConfirmar = [];
  var COLORES = [['#F07D47', '#fff'], ['#F2E8C7', '#331C1C'], ['#331C1C', '#F2E8C7'], ['#FFD2B8', '#331C1C']];

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  /* CADA GAJO MIDE LO QUE SALE. (24/9/2026, pedido de Tadeo)

     Hasta hoy la rueda partia el circulo en partes iguales (`360 / n`), asi que
     el tamano no decia nada: "Nada" se veia igual de grande que un premio.
     Ahora cada gajo ocupa su peso, o sea que **la rueda muestra sus propias
     chances** y se lee sola: la tajada mas grande es la que mas sale.

     Dos cuidados que no son opcionales:

     · **Piso de 22 grados.** Un premio con peso muy bajo daria una astilla
       donde no entra el texto y que es imposible de ver. Con el piso, los
       chicos se agrandan un poco y los demas se achican en proporcion para que
       la vuelta siga cerrando en 360. O sea que un gajo muy finito miente un
       poco a favor del premio chico, y es a proposito: preferible eso a un
       gajo ilegible.
     · **Sin pesos, partes iguales**, como siempre. Es lo que pasa si el
       servidor no contesta y se dibuja `PREMIOS_COPIA`, o con una copia vieja
       guardada en el telefono de antes de este cambio. La rueda nunca se queda
       sin dibujar. */
  var GAJO_MIN = 22;
  function gajos() {
    /* SEIS cuando no hay premios, no uno: `dibujar()` usa `premios.length || 6`
       para la rueda generica, y si aca devolviera un solo gajo el bucle leeria
       `G[1].ang` de undefined y la rueda no se dibuja. Los dos numeros tienen
       que ser el mismo. */
    var m = premios.length || 6, i, out = [], tot = 0;
    for (i = 0; i < m; i++) tot += Math.max(0, Number(premios[i] && premios[i].peso) || 0);
    var ang = [];
    if (!tot) { for (i = 0; i < m; i++) ang.push(360 / m); }
    else {
      for (i = 0; i < m; i++) ang.push(360 * Math.max(0, Number(premios[i].peso) || 0) / tot);
      /* El piso, repartiendo el costo entre los que estan por encima. Si TODOS
         estan por debajo del piso (muchos premios), no hay de donde sacar: se
         dejan iguales, que es lo unico que cierra. */
      var falta = 0, sobra = 0;
      for (i = 0; i < m; i++) { if (ang[i] < GAJO_MIN) falta += GAJO_MIN - ang[i]; else sobra += ang[i] - GAJO_MIN; }
      if (falta > 0 && sobra > falta) {
        var f = (sobra - falta) / sobra;
        for (i = 0; i < m; i++) ang[i] = ang[i] < GAJO_MIN ? GAJO_MIN : GAJO_MIN + (ang[i] - GAJO_MIN) * f;
      } else if (falta > 0) {
        for (i = 0; i < m; i++) ang[i] = 360 / m;
      }
    }
    var acum = 0;
    for (i = 0; i < m; i++) { out.push({ ini: acum, ang: ang[i], mid: acum + ang[i] / 2 }); acum += ang[i]; }
    return out;
  }
  function corto(t) {
    t = String(t || ''); var m;
    if (/^nada\b/i.test(t)) return 'Nada';
    if ((m = t.match(/(\d+)\s*%/))) return m[1] + '% OFF';
    if (/paquete de empanadas/i.test(t)) return 'Empanadas';
    return t.replace(/\s+de regalo$/i, '');
  }

  /* La rueda, con los premios que manda el servidor. Sin respuesta, una rueda
     genérica: la página no se queda en blanco. */
  function dibujar() {
    /* El peso entra en la firma: si cambia un tamano y no se repinta, la rueda
       queda dibujada con los gajos viejos y el premio frena en el lugar
       equivocado. */
    var firma = premios.map(function (p) { return p.txt + '#' + (p.peso || 0); }).join('|');
    if (firma && firma === dibujados) return;   // misma rueda: no la repinto (se notaba el salto)
    dibujados = firma;
    var n = premios.length || 6, G = gajos(), h = '';
    /* Un color por PREMIO, no por posicion (23/9/2026). Con los seis de Los
       Robles, los tres casilleros de "15% OFF" caen en 0, 2 y 4: con un ciclo
       de cuatro colores, dos salian naranjas y el tercero marron, y en la
       mesa preguntaron por que un 15% se veia distinto. En una accion presencial la
       rueda tiene que leerse sola.

       Si el mismo premio cae en dos gajos pegados, comparten color a
       proposito: es el mismo premio, y verlo como una porcion mas grande dice
       la verdad — justamente que hay mas chances de que salga. */
    var tono = {}, nTono = 0;
    premios.forEach(function (pr) { var t = corto(pr.txt); if (!(t in tono)) tono[t] = nTono++; });
    for (var i = 0; i < n; i++) {
      var A = G[i].ang;
      var a0 = G[i].ini * Math.PI / 180, a1 = (G[i].ini + A) * Math.PI / 180;
      var c = COLORES[(premios.length ? tono[corto(premios[i].txt)] : i) % COLORES.length];
      var x0 = 150 + 146 * Math.sin(a0), y0 = 150 - 146 * Math.cos(a0), x1 = 150 + 146 * Math.sin(a1), y1 = 150 - 146 * Math.cos(a1);
      h += '<path d="M150 150 L' + x0.toFixed(2) + ' ' + y0.toFixed(2) + ' A146 146 0 ' + (A > 180 ? 1 : 0) + ' 1 ' + x1.toFixed(2) + ' ' + y1.toFixed(2) + ' Z" fill="' + c[0] + '" stroke="#fff" stroke-width="2"/>';
      var txt = premios.length ? corto(premios[i].txt) : '🎁', partes = txt.length > 10 && txt.indexOf(' ') > 0 ? [txt.slice(0, txt.indexOf(' ')), txt.slice(txt.indexOf(' ') + 1)] : [txt];
      var mid = G[i].mid;
      /* EL TEXTO NO PUEDE SER MAS ANCHO QUE SU GAJO. (24/9/2026)

         Tadeo, camino al colegio: *"quedo medio desparejo la palabra
         'Empanadas' en la ruleta"*. El tamano de letra estaba atado solo al
         LARGO del texto, no al ancho del gajo — y desde que los gajos miden
         distinto eso no alcanza: "10% OFF" en un gajo de 104° entra comodo, y
         "Empanadas" en uno de 47° se sale por los dos lados.

         Se mide el arco que hay disponible a la altura donde cae el texto y se
         achica la letra hasta que entre. La cuenta de 0,62 por caracter es el
         ancho medio de la Montserrat en negrita — aproximada a proposito: mas
         vale una letra un punto chica que una palabra pisando el borde. */
      var largoMax = Math.max.apply(null, partes.map(function (p) { return p.length; }));
      var rTxt = 150 - (partes.length > 1 ? 52 : 60);
      var arco = 2 * Math.PI * rTxt * A / 360;
      /* 0,85 del arco y no el arco entero: el texto se dibuja en linea RECTA
         sobre un gajo que se abre, asi que las puntas de la palabra caen mas
         lejos del centro que el medio y se comen mas angulo del que da la
         cuenta plana. Con el arco entero daba 13px y "Empanadas" seguia
         pisando el borde — se vio en la foto, no en el numero. */
      var fs = Math.max(9, Math.min(txt.length > 12 ? 12 : 14, Math.floor(arco * 0.85 / (0.62 * largoMax))));
      h += '<g transform="rotate(' + mid.toFixed(2) + ' 150 150)"><text x="150" y="' + (partes.length > 1 ? 52 : 60) + '" text-anchor="middle" fill="' + c[1] + '" font-family="Montserrat, sans-serif" font-weight="800" font-size="' + fs + '">'
        + partes.map(function (p, k) { return '<tspan x="150" dy="' + (k ? 16 : 0) + '">' + esc(p) + '</tspan>'; }).join('') + '</text></g>';
    }
    h += '<circle cx="150" cy="150" r="146" fill="none" stroke="#331C1C" stroke-width="6"/>';
    gira.innerHTML = h;
    poner();
  }
  function poner() { gira.setAttribute('transform', 'rotate(' + (rot % 360).toFixed(2) + ' 150 150)'); }

  /* Gira parejo mientras el servidor contesta; al llegar el premio, frena sobre él. */
  var VEL = 540, VMIN = 420, VMAX = 1600, vel = VEL;   // grados por segundo; vel lleva el signo del dedo
  function arrancar(v) {
    girando = true; vel = v || VEL; var t0 = performance.now();
    (function paso(t) {
      if (!girando) return;
      var dt = (t - t0) / 1000; t0 = t;
      /* Mientras el servidor sortea, la rueda pierde velocidad de a poco como una de
         verdad, pero nunca baja de VMIN: parada, parecería trabada. */
      var s = Math.max(VMIN, Math.abs(vel) * Math.pow(0.55, dt));
      vel = vel < 0 ? -s : s;
      rot += vel * dt; poner(); raf = requestAnimationFrame(paso);
    })(t0);
  }
  function frenarEn(i, listo) {
    girando = false; cancelAnimationFrame(raf);
    /* El centro y el ancho salen del MISMO reparto que dibujo la rueda. Con
       gajos de distinto tamano, un `360/n` aca haria frenar la flecha en
       cualquier lado — y encima el error seria peor en los gajos mas chicos,
       que son los que mas importa acertar. El jitter se mide sobre el ancho de
       ESE gajo, asi que nunca se pasa de largo. */
    var G = gajos(), g = G[i] || { mid: 0, ang: 360 / (premios.length || 1) };
    var s = Math.abs(vel) || VEL, dir = vel < 0 ? -1 : 1;
    var jit = (Math.random() - 0.5) * g.ang * 0.6;
    var destino = ((360 - g.mid + jit) % 360 + 360) % 360;
    /* Frena en el sentido en que la tiró el dedo, con al menos media vuelta más
       (o lo que dé la velocidad), y arrancando a esa misma velocidad: el ease-out
       cuadrático sale a 2·Δ/D, así que D = 2·Δ/s. Frena en ~1-2,5 s. */
    var extra = Math.max(180, s * 0.55), desde = rot, fin;
    if (dir > 0) { var b = rot + extra; fin = b + (((destino - b % 360) % 360) + 360) % 360; }
    else { var b2 = rot - extra; fin = b2 - ((((b2 % 360) - destino) % 360) + 360) % 360; }
    var D = 2 * Math.abs(fin - desde) / s * 1000, t0 = performance.now();   // ease-out cuadrático: sale a 2·Δ/D = s
    (function paso(t) {
      var x = Math.min(1, (t - t0) / D), e = 1 - (1 - x) * (1 - x);
      rot = desde + (fin - desde) * e; poner();
      if (x < 1) requestAnimationFrame(paso); else listo();
    })(t0);
  }
  function parar() { girando = false; cancelAnimationFrame(raf); }

  /* Frena donde esté, suave. Solo si el premio que mandó el servidor no está en la
     rueda dibujada (no debería pasar): antes cortaba en seco. */
  function frenarSuave(listo) { frenarEn(Math.floor(Math.random() * (premios.length || 1)), listo); }

  /* En qué casillero cae el premio: por posición si coincide el texto, si no por texto. */
  function casillero(p) {
    if (!p) return -1;
    if (p.i >= 0 && premios[p.i] && premios[p.i].txt === p.txt) return p.i;
    for (var j = 0; j < premios.length; j++) if (premios[j].txt === p.txt) return j;
    return -1;
  }

  function confirmar() { confirmados = true; var f = alConfirmar; alConfirmar = []; f.forEach(function (g) { g(); }); }
  function cargar() {
    dibujar();
    fetch(API + '?action=ruleta&t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
      if (d && d.ok && Array.isArray(d.premios) && d.premios.length) {
        premios = d.premios;
        try { localStorage.setItem('maleu_ruleta_premios', JSON.stringify(d.premios)); } catch (e) {}
      }
      if (d && d.ok && d.activa === false) { $('girar').disabled = true; mostrarError('La ruleta está en pausa. ¡Volvé más tarde!'); }
      if (!girando) dibujar();   // girando: se redibuja al frenar, no a mitad de vuelta
      confirmar();
    }).catch(function () { confirmar(); });
  }

  function mostrarError(t, campo) {
    $('err').textContent = t || '';
    ['nombre', 'tel', 'barrio'].forEach(function (k) { $(k).classList.toggle('mal', campo === k); });
    if (campo) try { $(campo).focus(); } catch (e) {}
  }

  function resultado(d) {
    var box = $('res'), h = '', nombre = esc(d.nombre || '');
    /* "CLIENTE" NO ES EL NOMBRE DE NADIE. (24/9/2026)

       Desde esta manana el link de WhatsApp lleva SOLO el telefono, asi que la
       pagina manda `nombre: 'Cliente WhatsApp'` —el backend exige uno— y el
       servidor devuelve el primer pedazo: **"Cliente"**. La pantalla quedaba
       saludando *"¡Cliente, ganaste 15%!"*, que no parece un premio, parece un
       error. Salio en los cinco casos de `ver_pantallas_premios.js`, que es la
       primera prueba que mira LA PANTALLA y no el JSON de la respuesta.

       Cuando no sabemos como se llama, no se la saluda y listo: "¡Ganaste 15%
       en tu proxima compra!" se lee mejor que cualquier relleno. Y el dia que
       el nombre vuelva a viajar, el saludo vuelve solo. */
    if (/^cliente$/i.test(nombre)) nombre = '';
    var ganaste = nombre ? '¡' + nombre + ', ganaste' : '¡Ganaste';
    var link = function (txt, url, sec) { return '<a class="btn' + (sec ? ' sec' : '') + '" href="' + esc(url) + '">' + txt + '</a>'; };
    if (d.yaCliente) {
      h = '<div class="emoji">🧡</div><h2>¡' + (nombre ? nombre + ', y' : 'Y') + 'a sos cliente de Maleu!</h2><p>La ruleta es para quien todavía no nos probó. Gracias por elegirnos.</p>' + link('Hacer un pedido', TIENDA);
    } else if (d.premio && d.premio.nada) {
      h = '<div class="emoji">🙃</div><h2>' + (d.repetido ? 'Ya giraste la ruleta' : '¡Uh, esta vez no tocó!') + '</h2><p>Pero chusmeá la tienda: pizzas, empanadas, sorrentinos y carne fresca, en la puerta de tu casa.</p>' + link('Chusmear la tienda', TIENDA);
    } else if (d.premio && (d.premio.tipo === 'MOMENTO' || /paquete de empanadas/i.test(d.premio.txt || ''))) {
      /* Se entrega AHÍ, en el puesto: lo que importa es que se vea grande para
         mostrárselo a Lucas. El cupón nace usado (no se canjea otra vez online). */
      h = '<div class="emoji">🥟</div><h2>' + (d.repetido ? 'Ya giraste: te tocó' : ganaste) + ' <span style="color:#F07D47">' + esc(d.premio.txt) + '</span>' + (d.repetido ? '' : '!') + '</h2>'
        + (d.cupon ? '<div class="codigo">' + esc(d.cupon) + '</div>' : '')
        + '<p><b>Mostrá esta pantalla en nuestro puesto y retirá tu paquete.</b></p>'
        + link('Ver la tienda', TIENDA, true);
    } else if (d.premio) {
      var min = Number(d.premio.min) || 0;
      h = '<div class="emoji">🎉</div><h2>' + (d.repetido ? 'Ya giraste la ruleta: tu premio es' : ganaste) + ' <span style="color:#F07D47">' + esc(d.premio.txt) + '</span>' + (d.repetido ? '' : '!') + '</h2>';
      if (d.usado) h += '<p>Ese premio ya lo usaste en un pedido. ¡Gracias!</p>' + link('Ver la tienda', TIENDA);
      else {
        h += '<div class="codigo">' + esc(d.cupon) + '</div>'
          + '<p>Para tu próximo pedido' + (min ? ', con un pedido de más de $' + min.toLocaleString('es-AR') : '') + (d.vence ? '. Vale hasta el ' + esc(d.vence) : '') + '.</p>'
          /* El origen viaja con el cupon (24/9/2026): asi la tienda sabe que a
             este cliente lo trajimos nosotros y no se lo asigna al vendedor del
             barrio. Sin esto, el de Manzanares que gira la ruleta termina como
             pedido de Rufo. */
          + link('Hacer mi pedido', TIENDA + '?cupon=' + encodeURIComponent(d.cupon)
              + '&o=' + encodeURIComponent(P.o || 'ruleta')
              + (P.d ? '&d=' + encodeURIComponent(P.d) : '')
              + (P.r ? '&r=' + encodeURIComponent(P.r) : ''))
          + '<p class="hint">Sacale una captura a esta pantalla. Si pedís por WhatsApp, pasanos el código.</p>';
      }
    }
    box.innerHTML = h; box.hidden = false; $('form').hidden = true; $('tirala').hidden = true;
    try { box.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {}
    try { localStorage.setItem('maleu_ruleta', JSON.stringify({ t: Date.now(), d: d })); } catch (e) {}
  }

  /* ── Girar con el dedo (23/9/2026) ─────────────────────────────────────────
     El pedido fue textual: "que gire con el dedo como en Preguntados; si tocan
     el botón y gira solo parece fake". Flujo: el adulto completa sus datos → "Listo" → la rueda
     se habilita y se tira con el dedo. La velocidad y el sentido son los del dedo;
     el premio lo sigue eligiendo el servidor (la rueda frena donde él dice).
     Antes de completar los datos la rueda NO atrapa el dedo: el que la roza para
     scrollear tiene que poder scrollear. */
  var datos = null, armada = false, lanzada = false, rueda = document.querySelector('.rueda'), btn = $('girar');

  function armar() {
    armada = true; rueda.classList.add('lista');
    $('form').hidden = true; $('tirala').hidden = false;
    try { rueda.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) {}
  }
  function desarmar(msg) {
    armada = false; lanzada = false; rueda.classList.remove('lista');
    $('tirala').hidden = true; $('form').hidden = false; btn.disabled = false; btn.textContent = '¡Listo! Quiero girar';
    mostrarError(msg || '');
  }

  $('form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (girando || lanzada) return;
    var nombre = $('nombre').value.trim(), tel = $('tel').value.trim(), barrio = $('barrio').value.trim();
    if (nombre.length < 2) return mostrarError('Contanos tu nombre', 'nombre');
    if (tel.replace(/\D/g, '').length < 10) return mostrarError('Tu celular con código de área, por ejemplo 11 2345 6789', 'tel');
    if (barrio.length < 2) return mostrarError('¿En qué barrio vivís?', 'barrio');
    mostrarError('');
    datos = { nombre: nombre, tel: tel, barrio: barrio };
    armar();
    sortear();
  });

  /* El sorteo arranca al tocar "Listo", NO al soltar el dedo (24/9/2026).
     El servidor tarda ~13 s en sortear (medido en producción el 24/9: 15 s desde
     soltar el dedo hasta ver el premio). Mientras la persona lee "girá la rueda" y
     desliza, el servidor ya está trabajando: al soltar, el premio casi siempre ya
     llegó y la rueda frena enseguida. El premio lo sigue eligiendo el servidor.
     Si alguien toca "Listo" y nunca gira, el lead y el premio quedan igual cargados
     (volver a escanear devuelve el mismo premio, con repetido:true). */
  var sorteo = null;
  function sortear() {
    var s = sorteo = { listo: false, d: null, red: false, esperan: [] };
    var fin = function (d, red) {
      if (s !== sorteo || s.listo) return;
      s.listo = true; s.d = d; s.red = !!red; clearTimeout(s.reloj);
      var f = s.esperan; s.esperan = []; f.forEach(function (g) { g(); });
      /* Si todavía no giró y el servidor dice que no se puede (dato mal cargado,
         ya es cliente, sin conexión), se avisa ya: no tiene sentido hacerle
         girar la rueda para enterarse. */
      if (!lanzada) {
        if (s.red || !d || (!d.ok && !d.yaCliente)) { sorteo = null; desarmar((d && d.error) || 'No pudimos girar: revisá la conexión y probá de nuevo.'); if (d && d.campo) mostrarError(d.error, d.campo); }
        else if (d.yaCliente || d.repetido) { armada = false; rueda.classList.remove('lista'); resultado(d); }   // ya jugó: el premio que tenía, sin volver a tirar
      }
    };
    s.reloj = setTimeout(function () { fin(null, true); }, 30000);
    fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'ruletaGirar', nombre: datos.nombre, tel: datos.tel, barrio: datos.barrio, web: $('web').value, o: P.o || '', d: P.d || '', r: P.r || '' }) })
      .then(function (r) { return r.json(); })
      .then(function (d) { fin(d, false); })
      .catch(function () { fin(null, true); });
  }

  /* El gesto: la rueda sigue al dedo mientras arrastra; al soltar, la velocidad de
     los últimos ~100 ms decide si sale girando. Un toque suave no cuenta. */
  var arr = null;
  function anguloDe(ev) {
    var r = rueda.getBoundingClientRect(), x = ev.clientX - (r.left + r.width / 2), y = ev.clientY - (r.top + r.height / 2);
    return Math.atan2(x, -y) * 180 / Math.PI;   // 0 arriba, positivo en sentido horario (igual que rotate())
  }
  rueda.addEventListener('pointerdown', function (ev) {
    if (!armada || lanzada) {
      if (!lanzada && !girando) { mostrarError('Primero poné tu celular 👇', 'tel'); try { $('form').scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }
      return;
    }
    ev.preventDefault();
    try { rueda.setPointerCapture(ev.pointerId); } catch (e) {}
    var a = anguloDe(ev);
    arr = { id: ev.pointerId, ult: a, rot0: rot, mov: [{ t: performance.now(), rot: rot }] };
  });
  rueda.addEventListener('pointermove', function (ev) {
    if (!arr || ev.pointerId !== arr.id) return;
    var a = anguloDe(ev), d = a - arr.ult;
    if (d > 180) d -= 360; else if (d < -180) d += 360;   // cruzar el "arriba" no es media vuelta
    arr.ult = a; rot += d; poner();
    var t = performance.now(); arr.mov.push({ t: t, rot: rot });
    while (arr.mov.length > 2 && t - arr.mov[0].t > 120) arr.mov.shift();
  });
  function soltar(ev) {
    if (!arr || ev.pointerId !== arr.id) return;
    /* La velocidad sale de los últimos movimientos, no del momento de soltar: entre
       el último movimiento y el soltar siempre hay una pausa mínima que la diluía.
       Si el dedo quedó quieto más de 150 ms antes de soltar, frenó: no se tira. */
    var m = arr.mov, t = performance.now(), p = m[0], u = m[m.length - 1], v = 0;
    if (m.length > 1 && u.t - p.t > 8 && t - u.t < 150) v = (u.rot - p.rot) / ((u.t - p.t) / 1000);
    arr = null;
    if (Math.abs(v) < 250) { $('tirala-txt').textContent = '¡Más fuerte! Deslizá rápido el dedo sobre la rueda'; return; }
    lanzar(Math.max(VMIN, Math.min(VMAX, Math.abs(v))) * (v < 0 ? -1 : 1));
  }
  rueda.addEventListener('pointerup', soltar);
  rueda.addEventListener('pointercancel', soltar);
  /* Para quien no puede deslizar (accesibilidad, o un dedo que no le sale). */
  $('tirala-btn').addEventListener('click', function () { if (armada && !lanzada) lanzar(900); });

  function lanzar(v0) {
    lanzada = true; rueda.classList.remove('lista');
    $('tirala-txt').textContent = '¡Girando!'; $('tirala-btn').hidden = true;
    var txt = function (s) { $('tirala-txt').textContent = s; };
    arrancar(v0);
    var t0 = Date.now(), s = sorteo;
    /* Si el servidor todavía no contestó, que se note que está trabajando: una
       rueda que gira sin fin parece colgada. */
    var aviso1 = setTimeout(function () { if (girando) txt('Sorteando tu premio…'); }, 2500);
    var aviso2 = setTimeout(function () { if (girando) txt('Ya casi…'); }, 9000);
    var fallo = function (msg, campo) { clearTimeout(aviso1); clearTimeout(aviso2); parar(); sorteo = null; desarmar(msg || 'No pudimos girar: revisá la conexión y probá de nuevo.'); if (campo) mostrarError(msg, campo); };
    if (!s) return fallo();
    var alLlegar = function () {
        clearTimeout(aviso1); clearTimeout(aviso2);
        if (s.red) return fallo();
        var d = s.d;
        var espera = Math.max(0, 900 - (Date.now() - t0));   // que se vea girar aunque el premio ya estuviera
        var seguir = function () {
          if (!d || (!d.ok && !d.yaCliente)) return fallo((d && d.error) || 'No pudimos girar. Probá de nuevo.', d && d.campo);
          if (!d.ok || !d.premio) { return frenarSuave(function () { resultado(d); }); }   // ya es cliente
          dibujar();   // si el servidor cambió la lista mientras giraba, la rueda queda al día antes de frenar
          var i = casillero(d.premio);
          if (i < 0 || d.repetido) { return (i < 0 ? frenarSuave : function (f) { frenarEn(i, f); })(function () { setTimeout(function () { resultado(d); }, 300); }); }
          frenarEn(i, function () {
            setTimeout(function () { resultado(d); }, 450);
            try { gtag('event', 'generate_lead', { origen: P.o || 'qr', premio: d.premio.txt }); } catch (e) {}
            try { fbq('track', 'Lead', { content_name: 'Ruleta ' + (P.o || 'qr') }); } catch (e) {}
          });
        };
        /* Frena recién con la lista de premios confirmada por el servidor (tope 4 s):
           así la rueda no cae en un casillero de una lista vieja. */
        setTimeout(function () {
          if (confirmados || !d || !d.premio || casillero(d.premio) >= 0) return seguir();   // el premio ya está en la rueda: no hay que esperar
          var hecho = false, una = function () { if (!hecho) { hecho = true; seguir(); } };
          alConfirmar.push(una); setTimeout(una, 4000);
        }, espera);
    };
    if (s.listo) alLlegar(); else s.esperan.push(alLlegar);
  }

  if (P.o === 'evento') $('sub').textContent = 'Si querés Maleu en tu casa, empezá con un regalo.';
  cargar();

  /* ── Sin formulario (24/9/2026) ────────────────────────────────────────────
     Tadeo y Lucas: "escaneando el QR ya nos escribe por WhatsApp, el lead ya
     quedó; que entren al link y jueguen, lo más rápido posible". La respuesta
     de WATI trae el teléfono y el nombre de WhatsApp en el link (t= y n=):
     con eso no se pregunta nada y el sorteo arranca al abrir.

     UNA vez por persona, con dos candados:
     · el servidor, por teléfono: volver a entrar devuelve el mismo premio
       (repetido:true) y se muestra sin rueda;
     · el celular: el resultado queda guardado y al refrescar o re-escanear se
       ve directo, sin rueda ni pedido al servidor.
     Si el link llega SIN teléfono (WATI no reemplazó la variable, o el link se
     reenvió), queda un solo campo: el celular. Sin él no hay candado posible. */
  (function arranque() {
    /* ?denuevo=1 — BORRA EL CANDADO DEL CELULAR. (24/9/2026)

       Hay DOS candados y son distintos. El del servidor es por telefono y es el
       que manda. El del celular es una comodidad: guarda el resultado para que
       al refrescar se vea directo, sin rueda ni pedido.

       Probando la ruleta antes de Los Robles, Tadeo escaneo el QR y le seguia
       apareciendo el premio de AYER — con el texto viejo "15% en tu primera
       compra", que ya no existe en la planilla—, porque el candado del celular
       le gana al servidor: se muestra antes de preguntar. El modo prueba que se
       habia hecho era del backend y no tocaba esto.

       ESTO NO ABRE NINGUN AGUJERO. El candado de verdad sigue entero: si alguien
       entra con ?denuevo=1 y ya jugo, el servidor le contesta `repetido` y le
       muestra el mismo premio de siempre. Lo unico que se saltea es la copia
       guardada en su propio telefono. */
    if (/[?&]denuevo=1/.test(location.search)) { try { localStorage.removeItem('maleu_ruleta'); } catch (e) {} }
    try {
      var g = JSON.parse(localStorage.getItem('maleu_ruleta') || 'null');
      /* Solo un PREMIO cierra el candado. "Ya sos cliente" no: desde el 24/9/2026
         juegan todos, y un celular que guardó ese cartel ayer se quedaría afuera
         para siempre aunque el servidor ya lo deje girar. */
      if (g && g.d && g.d.yaCliente && !g.d.premio) localStorage.removeItem('maleu_ruleta');
      else if (g && g.d && g.d.premio) {
        var dd = g.d; dd.repetido = true;
        return resultado(dd);
      }
    } catch (e) {}
    var limpio = function (v) { v = String(v || ''); return /[{}]/.test(v) ? '' : v; };   // "{{phone}}" sin reemplazar = no vino
    var tel = limpio(P.t || P.tel).replace(/\D/g, '');
    var nom = limpio(P.n || P.nombre).replace(/\s+/g, ' ').trim().slice(0, 60);
    /* CON EL TELEFONO ALCANZA: NO SE LE PREGUNTA NADA. (Tadeo, 24/9/2026)

       El link de WhatsApp lleva SOLO el telefono. El nombre se saco a
       proposito, y la razon es doble:

       · **El link se cortaba.** WhatsApp termina el enlace en el primer
         espacio, asi que "Tadeo Ustariz" dejaba "Ustariz" colgando en negro
         afuera del link. Se veia roto y llegaba el nombre a medias.
       · **Y no hace falta.** Tadeo: *"ya que una madre haya escaneado, ya es un
         lead. Despues veremos alternativas para sacarle mas info, pero no hace
         falta saber sus datos de una"*. El telefono identifica a la casa, que
         es la unidad con la que trabaja Maleu.

       O sea que viniendo del QR **la rueda arranca sola, sin una sola
       pregunta**. El lead entra sin nombre (el backend lo guarda como "Cliente
       WhatsApp", porque exige uno) y se lo reconoce por el telefono.

       El formulario sigue vivo para el unico caso que lo necesita: alguien que
       abre la pagina sin pasar por el QR, de quien no sabemos ni el telefono. */
    var hayTel = tel.length >= 10;
    if (nom.length < 2) nom = 'Cliente WhatsApp';
    $('nombre').value = nom; $('barrio').value = 'Sin dato';
    if (hayTel) $('tel').value = tel;
    $('f-nombre').hidden = true;
    $('f-barrio').hidden = true;
    /* El celular tampoco se pide si ya vino: preguntar un dato que ya tenemos
       es exactamente lo que hace pensar "me estan sacando datos". */
    $('f-tel').hidden = hayTel;
    if (hayTel) {
      datos = { nombre: nom, tel: tel, barrio: 'Sin dato' };
      armar(); sortear();
    }
  })();
})();
</script>
